<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>RushWind — Logo 风格对比</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; background: #F1F5F9; color: #0F172A; }
  h1 { font-size: 20px; padding: 28px 40px 0; }
  .sub { padding: 4px 40px 18px; font-size: 13px; opacity: .55; }
  .row { display: grid; grid-template-columns: 190px 190px 64px 64px 40px 40px 1fr; gap: 22px;
         align-items: center; background: #fff; border-radius: 16px; padding: 22px 40px; margin: 0 40px 18px; }
  .cell-dark { background: #101828; border-radius: 22px; padding: 14px; text-align: center; }
  .cell-light { background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 22px; padding: 13px; text-align: center; }
  .tiny-dark { background: #101828; border-radius: 8px; padding: 4px; text-align: center; width: 64px; }
  .tiny-light { background: #fff; border: 1px solid #E2E8F0; border-radius: 8px; padding: 4px; text-align: center; width: 64px; }
  img { display: block; }
  .name { font-weight: 700; font-size: 15px; }
  .desc { font-size: 13px; opacity: .6; margin-top: 4px; line-height: 1.6; }
</style>
</head>
<body>
<h1>RushWind · Logo 方向对比</h1>
<div class="sub">A 为现行方案；B–E 为备选风格。每行：深底大图 / 浅底大图 / 32px / 16px。</div>

<div class="row">
  <div class="cell-dark"><img src="../rushwind-icon.svg" width="150"></div>
  <div class="cell-light"><img src="light-a.svg" width="150"></div>
  <div class="tiny-dark"><img src="../rushwind-icon.svg" width="32"></div>
  <div class="tiny-light"><img src="light-a.svg" width="32"></div>
  <div class="tiny-dark"><img src="../rushwind-icon.svg" width="16"></div>
  <div class="tiny-light"><img src="light-a.svg" width="16"></div>
  <div><div class="name">A · 风化 R（现行）</div>
  <div class="desc">Rush≈Rust 双关；斜腿渐细甩出成风痕。渐变青→靛，成熟稳妥。</div></div>
</div>

<div class="row">
  <div class="cell-dark"><img src="concept-b-flat.svg" width="150"></div>
  <div class="cell-light"><img src="concept-b-flat.svg" width="150"></div>
  <div class="tiny-dark"><img src="concept-b-flat.svg" width="32"></div>
  <div class="tiny-light"><img src="concept-b-flat.svg" width="32"></div>
  <div class="tiny-dark"><img src="concept-b-flat.svg" width="16"></div>
  <div class="tiny-light"><img src="concept-b-flat.svg" width="16"></div>
  <div><div class="name">B · 风切几何</div>
  <div class="desc">平面双色，一道斜向风切把 R 分成天/海两色。瑞士极简，印刷友好。</div></div>
</div>

<div class="row">
  <div class="cell-dark"><img src="concept-c-terminal.svg" width="150"></div>
  <div class="cell-light"><img src="light-c.svg" width="150"></div>
  <div class="tiny-dark"><img src="concept-c-terminal.svg" width="32"></div>
  <div class="tiny-light"><img src="light-c.svg" width="32"></div>
  <div class="tiny-dark"><img src="concept-c-terminal.svg" width="16"></div>
  <div class="tiny-light"><img src="light-c.svg" width="16"></div>
  <div><div class="name">C · 终端磷光</div>
  <div class="desc">方头笔画 + 命令提示符 + 光标块。系统工具气，程序员的怀旧梗。</div></div>
</div>

<div class="row">
  <div class="cell-dark"><img src="concept-d-seal.svg" width="150"></div>
  <div class="cell-light"><img src="concept-d-seal.svg" width="150"></div>
  <div class="tiny-dark"><img src="concept-d-seal.svg" width="32"></div>
  <div class="tiny-light"><img src="concept-d-seal.svg" width="32"></div>
  <div class="tiny-dark"><img src="concept-d-seal.svg" width="16"></div>
  <div class="tiny-light"><img src="concept-d-seal.svg" width="16"></div>
  <div><div class="name">D · 锐风印章</div>
  <div class="desc">印泥红方章 + 楷体「锐风」。唯一直接使用中文名的方案，作者身份感最强。</div></div>
</div>

<div class="row">
  <div class="cell-dark"><img src="concept-e-loop.svg" width="150"></div>
  <div class="cell-light"><img src="light-e.svg" width="150"></div>
  <div class="tiny-dark"><img src="concept-e-loop.svg" width="32"></div>
  <div class="tiny-light"><img src="light-e.svg" width="32"></div>
  <div class="tiny-dark"><img src="concept-e-loop.svg" width="16"></div>
  <div class="tiny-light"><img src="light-e.svg" width="16"></div>
  <div><div class="name">E · 生命周期环</div>
  <div class="desc">环绕箭头呼应「生命周期编排」主业；保留渐变语言，语义最贴切。</div></div>
</div>

</body>
</html>
