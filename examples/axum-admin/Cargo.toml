[package]
name = "axum-admin"
description = "Admin/API surface demo: an axum router served under the RushWind lifecycle."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
rushwind-core = { workspace = true }
rushwind-transport = { workspace = true }
rushwind-transport-axum = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
