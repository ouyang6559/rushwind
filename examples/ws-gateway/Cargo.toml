[package]
name = "ws-gateway"
description = "Gated WebSocket gateway demo: handshake gate chain, session cap, lifecycle-aligned session shutdown."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
rushwind-core = { workspace = true }
rushwind-transport = { workspace = true }
rushwind-transport-axum = { workspace = true }
rushwind-transport-ws = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["ws"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
