[package]
name = "rushwind-registry-nacos"
description = "Nacos adapter for the RushWind registry contract: registration and discovery over the nacos-sdk naming client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Live nacos suite (via REGISTRY_NACOS_ADDRESS); run by CI's
# registry-integration job against a service container.
live = []

[dependencies]
rushwind-transport = { workspace = true }
rushwind-registry = { workspace = true }
nacos-sdk = "0.8"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
