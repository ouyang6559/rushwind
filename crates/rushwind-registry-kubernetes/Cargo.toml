[package]
name = "rushwind-registry-kubernetes"
description = "Kubernetes adapter for the RushWind registry contract: in-cluster pod-label registration and pod-watch discovery via the kube client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# In-cluster conformance suite; runs only inside a real cluster. Outside
# one, every test skips itself.
live = []

[dependencies]
rushwind-transport = { workspace = true }
rushwind-registry = { workspace = true }
kube = "4"
kube-runtime = "4"
k8s-openapi = { version = "0.28", features = ["latest"] }
futures = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
