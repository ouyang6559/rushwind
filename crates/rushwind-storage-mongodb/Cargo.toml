[package]
name = "rushwind-storage-mongodb"
description = "MongoDB engine for the RushWind storage contract: filter-tree to BSON translation and collection-backed repository."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Live suite against a running MongoDB (MONGODB_URI); run by CI's
# storage-integration job.
live = []

[dependencies]
rushwind-storage = { workspace = true }
mongodb = { workspace = true }

[dev-dependencies]
rushwind-testkit = { workspace = true, features = ["storage"] }
tokio = { workspace = true, features = ["macros", "rt"] }
