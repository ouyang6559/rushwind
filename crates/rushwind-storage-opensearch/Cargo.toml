[package]
name = "rushwind-storage-opensearch"
description = "OpenSearch engine for the RushWind storage contract: the Elasticsearch wire shape against an OpenSearch endpoint."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Live suite against a running OpenSearch (OPENSEARCH_URL); run by CI's
# storage-integration job.
live = []

[dependencies]
rushwind-storage = { workspace = true }
rushwind-storage-elasticsearch = { workspace = true }

[dev-dependencies]
rushwind-testkit = { workspace = true, features = ["storage"] }
reqwest = { workspace = true, default-features = false, features = ["json"] }
tokio = { workspace = true, features = ["macros", "rt"] }
