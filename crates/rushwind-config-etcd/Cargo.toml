[package]
name = "rushwind-config-etcd"
description = "etcd config source for the RushWind configuration contract: GET by key with native Watch in both signal and push modes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Live config suite (container-backed); run by CI.
live = []

[dependencies]
rushwind-config = { workspace = true }
rushwind-transport = { workspace = true }
etcd-client = "0.20"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }
