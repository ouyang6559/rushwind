[package]
name = "rushwind-storage-influxdb"
description = "InfluxDB engine for the RushWind storage contract: measurements as tables, ids as series tags, contract-side filtering and ordering."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Live suite against a running InfluxDB (INFLUXDB_URL); run by CI's
# storage-integration job.
live = []

[dependencies]
rushwind-storage = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
rushwind-testkit = { workspace = true, features = ["storage"] }
tokio = { workspace = true, features = ["macros", "rt"] }
