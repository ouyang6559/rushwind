[package]
name = "rushwind-broker-rabbitmq"
description = "RabbitMQ engine for the RushWind broker contract: AMQP 0-9-1 publish/subscribe over lapin against the amq.topic exchange."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Live RabbitMQ suite (via BROKER_RABBITMQ_URL); run by CI's broker
# integration job against a service container.
live = []

[dependencies]
rushwind-broker = { workspace = true }
rushwind-transport = { workspace = true }
lapin = "4"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }
