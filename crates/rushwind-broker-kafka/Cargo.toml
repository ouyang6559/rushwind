[package]
name = "rushwind-broker-kafka"
description = "Kafka engine for the RushWind broker contract: per-topic producers and consumer-group subscriptions over samsa, the pure-Rust Kafka protocol client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Live Kafka suite (via BROKER_KAFKA_ADDRS); run by CI's broker
# integration job against a service container.
live = []

[dependencies]
rushwind-broker = { workspace = true }
samsa = "0.1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util = { workspace = true }
futures = { workspace = true }
getrandom = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }
