[package]
name = "rushwind-apalis-postgres"
description = "Postgres storage backend for the apalis task queue: SKIP LOCKED claims, visibility timeouts, orphan recovery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Live conformance suite (via APALIS_PG_DATABASE_URL); run by CI's
# apalis-pg-integration job against a Postgres service container.
live = []

[dependencies]
apalis-core = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tracing = { workspace = true }
