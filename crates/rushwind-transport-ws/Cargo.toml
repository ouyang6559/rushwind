[package]
name = "rushwind-transport-ws"
description = "WebSocket session routes for axum-based RushWind servers: handshake gate chain, admission policy, lifecycle-aligned session shutdown."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rushwind-transport = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
tokio = { workspace = true, features = ["macros"] }

[dev-dependencies]
rushwind-core = { workspace = true }
rushwind-transport-axum = { workspace = true }
futures = { workspace = true }
tokio-tungstenite = "0.29"
tokio = { workspace = true, features = ["macros", "rt", "time"] }
