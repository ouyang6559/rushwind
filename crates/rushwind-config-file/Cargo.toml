[package]
name = "rushwind-config-file"
description = "File engine for the Rust configuration contract: one file as raw config bytes, directory-watched for editor-safe change push."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rushwind-config = { workspace = true }
notify = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }
