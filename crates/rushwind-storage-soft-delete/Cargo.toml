[package]
name = "rushwind-storage-soft-delete"
description = "Soft-delete decorator for the RushWind storage contract: deletes become tombstones, reads filter them, restore and purge opt back out."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rushwind-storage = { workspace = true }

[dev-dependencies]
rushwind-storage-memory = { workspace = true }
rushwind-testkit = { workspace = true, features = ["storage"] }
tokio = { workspace = true, features = ["macros", "rt"] }
