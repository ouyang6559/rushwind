[package]
name = "rushwind-retry"
description = "Composable retry for RushWind: exponential backoff with jitter, retry predicates, and total timeout, extracted from go-wind-plugins/retry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rushwind-transport = { workspace = true }
getrandom = { workspace = true }
tokio = { workspace = true, features = ["rt", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }
