[package]
name = "rushwind-http-binding"
description = "The proto-HTTP wire contract, parameterized by a caller-supplied descriptor pool: the form binder (dotted paths, both field-name spellings, map/list/oneof structure, the well-known leaf whitelist), Content-Type codec resolution, the pre-auth bind layer, the protojson response codec, the per-route lifecycle tail, and the four-field status error envelope. Semantics anchored to the reference implementation's sources (encoding/form/proto_decode.go, internal/httputil, the generated handler's Bind/encode sections, Status/DefaultErrorEncoder)."
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
serde_json = "1"
form_urlencoded = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
axum = { version = "0.8", default-features = false }
rushwind-authn = { workspace = true }
