[package]
name = "rushwind-circuitbreaker-sres"
description = "Google-SRE probabilistic circuit breaker for the RushWind circuitbreaker contract: graceful acceptance decay instead of hard open/close."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
rushwind-circuitbreaker = { workspace = true }
rushwind-transport = { workspace = true }
getrandom = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }
