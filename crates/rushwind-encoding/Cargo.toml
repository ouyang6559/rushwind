[package]
name = "rushwind-encoding"
description = "Codec contract for the RushWind encoding domain: serde marshaling behind named, registered codecs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
erased-serde = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
# The registry doctest and the registry-semantics unit tests need a real
# codec and derived test types.
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
rushwind-encoding-json = { workspace = true }
