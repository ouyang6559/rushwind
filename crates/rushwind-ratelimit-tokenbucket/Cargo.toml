[package]
name = "rushwind-ratelimit-tokenbucket"
description = "Token-bucket rate limiter for the RushWind ratelimit contract: refill at rate, burst capacity, Allow/Wait/Close."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rushwind-ratelimit = { workspace = true }
rushwind-transport = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }
