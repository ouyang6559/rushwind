[package]
name = "rushwind-metrics-prometheus"
description = "Prometheus engine for the Rust metrics contract: lazily-registered instruments over a registry, text-format exposition for a metrics route."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rushwind-metrics = { workspace = true }
