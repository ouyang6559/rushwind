[package]
name = "rushwind-oss-s3"
description = "S3 engine for the RushWind oss contract: SigV4-signed REST over reqwest, covering AWS S3 and MinIO."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Live S3 suite (via OSS_S3_* variables); run by CI's oss integration
# job against a MinIO service container.
live = []

[dependencies]
rushwind-oss = { workspace = true }
rushwind-transport = { workspace = true }
reqwest = { workspace = true }
rusty-s3 = "0.10"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }
