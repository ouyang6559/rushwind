[package]
name = "rushwind-storage-seaorm"
description = "SeaORM-backed engine for the RushWind storage contract: dynamic repository over SQL backends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rushwind-storage = { workspace = true }
sea-orm = { workspace = true }

[features]
# Live database suites (PostgreSQL/MySQL via STORAGE_DATABASE_URL); run by
# CI's storage-integration job against service containers.
live = []

[dev-dependencies]
rushwind-testkit = { workspace = true, features = ["storage"] }
tokio = { workspace = true, features = ["macros", "rt"] }
