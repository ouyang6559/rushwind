[package]
name = "rushwind-transport-quic"
description = "QUIC adapter for the RushWind lifecycle: raw quinn endpoint under the Server contract, with the full session middleware chain."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rushwind-transport = { workspace = true }
quinn = { version = "0.11", default-features = false, features = ["rustls-ring", "runtime-tokio"] }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[dev-dependencies]
rushwind-core = { workspace = true }
rushwind-testkit = { workspace = true }
quinn = { version = "0.11", default-features = false, features = ["rustls-ring", "runtime-tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
rcgen = "0.14"
tokio = { workspace = true, features = ["macros", "rt", "time"] }
