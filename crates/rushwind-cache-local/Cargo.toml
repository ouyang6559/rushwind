[package]
name = "rushwind-cache-local"
description = "In-process KV cache engine for the RushWind cache contract: TTL'd entries with lazy expiry and capacity eviction."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rushwind-cache = { workspace = true }
rushwind-transport = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }
