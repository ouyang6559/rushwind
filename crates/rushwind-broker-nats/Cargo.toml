[package]
name = "rushwind-broker-nats"
description = "NATS engine for the RushWind broker contract: core-NATS publish/subscribe over async-nats."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Live NATS suite (via BROKER_NATS_ADDRESS); run by CI's broker
# integration job against a service container.
live = []

[dependencies]
rushwind-broker = { workspace = true }
rushwind-transport = { workspace = true }
async-nats = "0.50"
futures = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }
