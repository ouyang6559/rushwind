[package]
name = "rushwind-registry-servicecomb"
description = "ServiceComb service-center adapter for the RushWind registry contract: registration, heartbeats, and WebSocket watch over the v4 registry API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Live service-center suite (via REGISTRY_SERVICECOMB_ADDRESS); run by
# CI's registry-integration job against a service container.
live = []

[dependencies]
rushwind-transport = { workspace = true }
rushwind-registry = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
getrandom = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-tungstenite = "0.30"
futures = { workspace = true }
