[package]
name = "rushwind-storage-observe"
description = "Observability decorator for the RushWind storage contract: tracing spans with table, operation and outcome on every repository call."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rushwind-storage = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
rushwind-storage-memory = { workspace = true }
rushwind-testkit = { workspace = true, features = ["storage"] }
tokio = { workspace = true, features = ["macros", "rt"] }
tracing-subscriber = { workspace = true }
futures = { workspace = true }
