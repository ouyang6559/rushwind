[package]
name = "rushwind-registry-etcd"
description = "Etcd registration-only adapter for the RushWind registry contract."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Live etcd suite (via REGISTRY_ETCD_ENDPOINT); run by CI's
# registry-integration job against a service container.
live = []

[dependencies]
rushwind-transport = { workspace = true }
rushwind-registry = { workspace = true }
etcd-client = "0.20"
tokio = { workspace = true, features = ["macros", "time"] }
