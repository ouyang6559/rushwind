[package]
name = "rushwind-registry-etcd"
description = "Etcd adapter for the RushWind registry contract: registration and discovery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Live etcd suite (via REGISTRY_ETCD_ENDPOINT); run by CI's
# registry-integration job against a service container.
live = []

[dependencies]
rushwind-transport = { workspace = true }
rushwind-registry = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
etcd-client = "0.20"
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
