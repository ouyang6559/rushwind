[package]
name = "rushwind-broker-stomp"
description = "STOMP engine for the RushWind broker contract: a minimal STOMP 1.2 client over raw TCP, talking to RabbitMQ's stomp plugin."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Live STOMP suite (via BROKER_STOMP_ADDRESS); run by CI's broker
# integration job against a service container.
live = []

[dependencies]
rushwind-broker = { workspace = true }
rushwind-transport = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "net", "io-util", "time", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }
