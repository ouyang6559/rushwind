[package]
name = "rushwind-transport-webtransport"
description = "WebTransport adapter for the RushWind lifecycle: wtransport endpoint under the Server contract, with the full session middleware chain."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rushwind-transport = { workspace = true }
wtransport = "0.7"
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[dev-dependencies]
rushwind-core = { workspace = true }
rushwind-testkit = { workspace = true }
# The test clients skip certificate validation against the
# self-signed test servers — wtransport gates that behind the
# dangerous-configuration feature.
wtransport = { version = "0.7", features = ["dangerous-configuration"] }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
