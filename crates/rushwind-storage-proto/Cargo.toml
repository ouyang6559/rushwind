[package]
name = "rushwind-storage-proto"
description = "Protobuf wire contract for the RushWind storage queries: generated types (prost/pbjson) and conversions to the rushwind-storage contracts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
rushwind-storage = { workspace = true }
prost = { workspace = true }
pbjson = { workspace = true }
pbjson-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
rushwind-storage-memory = { workspace = true }
rushwind-testkit = { workspace = true, features = ["storage"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[build-dependencies]
prost-build = { workspace = true }
protox = { workspace = true }
pbjson-build = { workspace = true }
