[package]
name = "rushwind-storage-cassandra"
description = "Cassandra engine for the RushWind storage contract: CQL over a bucket-fixed table, contract-side filtering and ordering."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Live suite against a running Cassandra 5 (CASSANDRA_HOSTS); run by CI's
# storage-integration job.
live = []

[dependencies]
rushwind-storage = { workspace = true }
scylla = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
rushwind-testkit = { workspace = true, features = ["storage"] }
tokio = { workspace = true, features = ["macros", "rt"] }
