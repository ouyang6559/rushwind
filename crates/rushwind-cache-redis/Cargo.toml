[package]
name = "rushwind-cache-redis"
description = "Redis engine for the RushWind cache contract: GET/SET/SETNX/DEL/EXISTS plus MGET and pipelined sets over the redis crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Live redis suite (via CACHE_REDIS_URL); run by CI's cache
# integration job against a service container.
live = []

[dependencies]
rushwind-cache = { workspace = true }
rushwind-transport = { workspace = true }
redis = { version = "1", default-features = false, features = ["tokio-comp", "connection-manager"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
redis = { version = "1", default-features = false, features = ["tokio-comp"] }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
