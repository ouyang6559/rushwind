[package]
name = "rushwind-broker-redis"
description = "Redis engine for the RushWind broker contract: pub/sub over a dedicated subscriber connection per topic."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Live redis suite (via BROKER_REDIS_URL); run by CI's broker
# integration job against a service container.
live = []

[dependencies]
rushwind-broker = { workspace = true }
rushwind-transport = { workspace = true }
redis = { version = "1", default-features = false, features = ["tokio-comp", "connection-manager"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
futures = { workspace = true }
tokio-util = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }
