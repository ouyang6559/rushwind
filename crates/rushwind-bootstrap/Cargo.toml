[package]
name = "rushwind-bootstrap"
description = "Config-driven assembly for RushWind applications: YAML -> engines, storage, HTTP servers with the full edge stack, and the cron transport, under one lifecycle."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# The /healthz + /readyz mounts over the health aggregator. Optional
# because the health crate's HTTP checker carries reqwest.
health = ["dep:rushwind-health", "rushwind-http/health"]
# The /metrics scrape mount plus the built-in Prometheus metrics
# engine. Optional because the prometheus client is a heavyweight
# third-party tree.
metrics = ["dep:rushwind-metrics-prometheus", "rushwind-http/metrics"]
# OTLP tracer-provider assembly from the tracer wire shape. Optional
# because the OTLP exporter tree (tonic included) is heavyweight.
trace = ["dep:rushwind-tracer"]

[dependencies]
rushwind-core = { workspace = true }
rushwind-transport = { workspace = true }
rushwind-transport-axum = { workspace = true }
rushwind-transport-cron = { workspace = true }
rushwind-storage = { workspace = true }
rushwind-storage-axum = { workspace = true }
rushwind-registry = { workspace = true }
rushwind-authn = { workspace = true }
rushwind-authz = { workspace = true }
rushwind-broker = { workspace = true }
rushwind-cache = { workspace = true }
rushwind-config = { workspace = true }
rushwind-metrics = { workspace = true }
rushwind-ratelimit = { workspace = true }
rushwind-circuitbreaker = { workspace = true }
rushwind-oss = { workspace = true }
rushwind-ai = { workspace = true }
rushwind-script = { workspace = true }
rushwind-http = { workspace = true }
axum = { version = "0.8", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
getrandom = { workspace = true }
# Feature-gated engine + mount surfaces; see [features] above.
rushwind-health = { workspace = true, optional = true }
rushwind-metrics-prometheus = { workspace = true, optional = true }
rushwind-tracer = { workspace = true, optional = true }

[dev-dependencies]
rushwind-storage-memory = { workspace = true }
rushwind-authn-apikey = { workspace = true }
rushwind-authn-noop = { workspace = true }
rushwind-authz-acl = { workspace = true }
rushwind-script-lua = { workspace = true }
tokio = { workspace = true, features = ["macros", "io-util", "net", "rt", "time"] }
