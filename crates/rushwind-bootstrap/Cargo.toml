[package]
name = "rushwind-bootstrap"
description = "Config-driven assembly for RushWind applications: YAML -> storage engine + HTTP servers + route packs, under one lifecycle."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rushwind-core = { workspace = true }
rushwind-transport = { workspace = true }
rushwind-transport-axum = { workspace = true }
rushwind-storage = { workspace = true }
rushwind-storage-axum = { workspace = true }
axum = { version = "0.8", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[dev-dependencies]
rushwind-storage-memory = { workspace = true }
tokio = { workspace = true, features = ["macros", "io-util", "net", "rt", "time"] }
