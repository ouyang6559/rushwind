[package]
name = "rushwind-broker-mqtt"
description = "MQTT engine for the RushWind broker contract: publish/subscribe over rumqttc with automatic resubscribe on reconnect."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Live MQTT suite (via BROKER_MQTT_ADDRESS); run by CI's broker
# integration job against a service container.
live = []

[dependencies]
rushwind-broker = { workspace = true }
rushwind-transport = { workspace = true }
rumqttc = { version = "0.25", default-features = false }
getrandom = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }
