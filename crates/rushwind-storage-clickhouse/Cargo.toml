[package]
name = "rushwind-storage-clickhouse"
description = "ClickHouse engine for the RushWind storage contract: SQL over HTTP (JSONEachRow), mutation-synced deletes and updates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Live suite against a running ClickHouse (CLICKHOUSE_URL); run by CI's
# storage-integration job.
live = []

[dependencies]
rushwind-storage = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
rushwind-testkit = { workspace = true, features = ["storage"] }
tokio = { workspace = true, features = ["macros", "rt"] }
