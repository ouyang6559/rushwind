[package]
name = "rushwind-transaction-dtm"
description = "DTM engine for the RushWind transaction contract: saga, TCC, 2-phase message, and XA over DTM's HTTP protocol on reqwest."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Live DTM suite (via DTM_SERVER); run against a real dtmsvr.
live = []

[dependencies]
reqwest = { workspace = true }
rushwind-transaction = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[test]]
name = "conformance_live"
required-features = ["live"]
