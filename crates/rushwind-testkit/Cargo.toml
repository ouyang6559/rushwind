[package]
name = "rushwind-testkit"
description = "Cross-adapter conformance suites for RushWind: lifecycle (transports) and repository (storage engines)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# Repository conformance suite over the rushwind-storage contract.
storage = ["dep:rushwind-storage"]

[dependencies]
rushwind-transport = { workspace = true }
rushwind-core = { workspace = true }
tokio = { workspace = true, features = ["time"] }
rushwind-storage = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }
rushwind-storage-memory = { workspace = true }
