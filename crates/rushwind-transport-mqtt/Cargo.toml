[package]
name = "rushwind-transport-mqtt"
description = "MQTT consumer bridge for the RushWind lifecycle: subscribes to an external broker via rumqttc and pumps messages into a handler under the Server contract."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rushwind-transport = { workspace = true }
rumqttc = { version = "0.25", default-features = false }
tokio = { workspace = true, features = ["macros", "time"] }

[dev-dependencies]
rushwind-core = { workspace = true }
rushwind-testkit = { workspace = true }
rumqttc = { version = "0.25", default-features = false }
rumqttd = { version = "0.20", default-features = false }
serde_json = "1"
tokio = { workspace = true, features = ["macros", "rt", "time", "net"] }
