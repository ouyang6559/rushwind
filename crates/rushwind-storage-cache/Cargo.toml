[package]
name = "rushwind-storage-cache"
description = "Cache-aside decorator for the RushWind storage contract: scope-aware caching with singleflight coalescing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rushwind-storage = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
rushwind-storage-memory = { workspace = true }
rushwind-testkit = { workspace = true, features = ["storage"] }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
