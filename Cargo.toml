[workspace]
resolver = "2"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.81"
license = "MIT"
repository = "https://github.com/tx7do/rushwind"

[workspace.dependencies]
tokio = "1"
futures = "0.3"
tokio-util = "0.7"
rushwind-transport = { path = "crates/rushwind-transport", version = "0.0.1" }
rushwind-core = { path = "crates/rushwind-core", version = "0.0.1" }
rushwind-testkit = { path = "crates/rushwind-testkit", version = "0.0.1" }
rushwind-transport-axum = { path = "crates/rushwind-transport-axum", version = "0.0.1" }
rushwind-transport-ws = { path = "crates/rushwind-transport-ws", version = "0.0.1" }
rushwind-transport-quic = { path = "crates/rushwind-transport-quic", version = "0.0.1" }
rushwind-transport-mqtt = { path = "crates/rushwind-transport-mqtt", version = "0.0.1" }
rushwind-registry = { path = "crates/rushwind-registry", version = "0.0.1" }
rushwind-registry-etcd = { path = "crates/rushwind-registry-etcd", version = "0.0.1" }
rushwind-authn = { path = "crates/rushwind-authn", version = "0.0.1" }
rushwind-authn-apikey = { path = "crates/rushwind-authn-apikey", version = "0.0.1" }
rushwind-authn-basicauth = { path = "crates/rushwind-authn-basicauth", version = "0.0.1" }
rushwind-authn-hmac = { path = "crates/rushwind-authn-hmac", version = "0.0.1" }
rushwind-authn-jwt = { path = "crates/rushwind-authn-jwt", version = "0.0.1" }
rushwind-authn-noop = { path = "crates/rushwind-authn-noop", version = "0.0.1" }
rushwind-authn-presharedkey = { path = "crates/rushwind-authn-presharedkey", version = "0.0.1" }
rushwind-authn-session = { path = "crates/rushwind-authn-session", version = "0.0.1" }
rushwind-authz = { path = "crates/rushwind-authz", version = "0.0.1" }
rushwind-authz-acl = { path = "crates/rushwind-authz-acl", version = "0.0.1" }
rushwind-authz-noop = { path = "crates/rushwind-authz-noop", version = "0.0.1" }
rushwind-authz-rbac = { path = "crates/rushwind-authz-rbac", version = "0.0.1" }
rushwind-storage = { path = "crates/rushwind-storage", version = "0.0.1" }
rushwind-storage-memory = { path = "crates/rushwind-storage-memory", version = "0.0.1" }
rushwind-storage-seaorm = { path = "crates/rushwind-storage-seaorm", version = "0.0.1" }
rushwind-storage-cache = { path = "crates/rushwind-storage-cache", version = "0.0.1" }
rushwind-storage-proto = { path = "crates/rushwind-storage-proto", version = "0.0.1" }
rushwind-storage-mongodb = { path = "crates/rushwind-storage-mongodb", version = "0.0.1" }
rushwind-bootstrap = { path = "crates/rushwind-bootstrap", version = "0.0.1" }
rushwind-storage-soft-delete = { path = "crates/rushwind-storage-soft-delete", version = "0.0.1" }
rushwind-storage-macros = { path = "crates/rushwind-storage-macros", version = "0.0.1" }
rushwind-storage-tree = { path = "crates/rushwind-storage-tree", version = "0.0.1" }
rushwind-storage-observe = { path = "crates/rushwind-storage-observe", version = "0.0.1" }
rushwind-storage-axum = { path = "crates/rushwind-storage-axum", version = "0.0.1" }
tracing = "0.1"
tracing-subscriber = "0.3"

# The document-store engine: the official MongoDB driver (bson comes with it).
mongodb = "3"
# ClickHouse speaks SQL over plain HTTP (FORMAT JSONEachRow); a thin reqwest
# client is the whole driver surface this adapter needs.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rushwind-storage-elasticsearch = { path = "crates/rushwind-storage-elasticsearch", version = "0.0.1" }
rushwind-storage-cassandra = { path = "crates/rushwind-storage-cassandra", version = "0.0.1" }
rushwind-storage-opensearch = { path = "crates/rushwind-storage-opensearch", version = "0.0.1" }
rushwind-storage-influxdb = { path = "crates/rushwind-storage-influxdb", version = "0.0.1" }
scylla = "1"

# Protobuf wire contract: types are generated from proto/rushwind/storage/v1
# (prost), with the protojson JSON mapping generated by pbjson. protox
# compiles the schemas — pure Rust, no system protoc.
prost = "0.14"
prost-build = "0.14"
pbjson = "0.9"
pbjson-types = "0.9"
pbjson-build = "0.9"
protox = "0.9"
serde = "1"
serde_json = "1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
jsonwebtoken = "9"
getrandom = "0.3"

# SeaORM backs the storage adapter: dynamic statement building (sea_query),
# connection pooling and transactions. All three SQL backends ship enabled —
# SQLite, PostgreSQL, MySQL — so one adapter serves the whole SQL family.
# The contract crate stays dependency-free.
sea-orm = { version = "2.0", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlx-sqlite",
    "sqlx-postgres",
    "sqlx-mysql",
    "macros",
] }

# Workspace-wide lint policy: RushWind crates contain no unsafe code, period.
[workspace.lints.rust]
unsafe_code = "forbid"
