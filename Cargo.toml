rushwind-storage-soft-delete = { path = "crates/rushwind-storage-soft-delete", version = "0.0.1" }
rushwind-storage-macros = { path = "crates/rushwind-storage-macros", version = "0.0.1" }
rushwind-storage-tree = { path = "crates/rushwind-storage-tree", version = "0.0.1" }
rushwind-storage-observe = { path = "crates/rushwind-storage-observe", version = "0.0.1" }
rushwind-storage-axum = { path = "crates/rushwind-storage-axum", version = "0.0.1" }
rushwind-apalis-postgres = { path = "crates/rushwind-apalis-postgres", version = "0.0.1" }
rushwind-encoding = { path = "crates/rushwind-encoding", version = "0.0.1" }
rushwind-encoding-json = { path = "crates/rushwind-encoding-json", version = "0.0.1" }
rushwind-encoding-msgpack = { path = "crates/rushwind-encoding-msgpack", version = "0.0.1" }
rushwind-encoding-yaml = { path = "crates/rushwind-encoding-yaml", version = "0.0.1" }
rushwind-encoding-toml = { path = "crates/rushwind-encoding-toml", version = "0.0.1" }
rushwind-encoding-cbor = { path = "crates/rushwind-encoding-cbor", version = "0.0.1" }
rushwind-encoding-bson = { path = "crates/rushwind-encoding-bson", version = "0.0.1" }
rushwind-encoding-xml = { path = "crates/rushwind-encoding-xml", version = "0.0.1" }
rushwind-encoding-proto = { path = "crates/rushwind-encoding-proto", version = "0.0.1" }
tracing = "0.1"
tracing-subscriber = "0.3"

# The document-store engine: the official MongoDB driver (bson comes with it).
mongodb = "3"
# ClickHouse speaks SQL over plain HTTP (FORMAT JSONEachRow); a thin reqwest
# client is the whole driver surface this adapter needs.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rushwind-storage-elasticsearch = { path = "crates/rushwind-storage-elasticsearch", version = "0.0.1" }
rushwind-storage-cassandra = { path = "crates/rushwind-storage-cassandra", version = "0.0.1" }
rushwind-storage-opensearch = { path = "crates/rushwind-storage-opensearch", version = "0.0.1" }
rushwind-storage-influxdb = { path = "crates/rushwind-storage-influxdb", version = "0.0.1" }
scylla = "1"

# Protobuf wire contract: types are generated from proto/rushwind/storage/v1
# (prost), with the protojson JSON mapping generated by pbjson. protox
# compiles the schemas — pure Rust, no system protoc.
prost = "0.14"
prost-build = "0.14"
pbjson = "0.9"
pbjson-types = "0.9"
pbjson-build = "0.9"
protox = "0.9"
serde = "1"
serde_json = "1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
jsonwebtoken = "9"
getrandom = "0.3"

# SeaORM backs the storage adapter: dynamic statement building (sea_query),
# connection pooling and transactions. All three SQL backends ship enabled —
# SQLite, PostgreSQL, MySQL — so one adapter serves the whole SQL family.
# The contract crate stays dependency-free.
sea-orm = { version = "2.0", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlx-sqlite",
    "sqlx-postgres",
    "sqlx-mysql",
    "macros",
] }

# The apalis task-queue storage traits: the Postgres backend implements
# `Storage` + `Backend` from this crate. The `apalis` facade (worker
# runtime, Monitor) is left to consumers of the storage, not the storage
# itself. `json` brings the JsonCodec the storage persists with; `sleep`
# brings the interval stream the heartbeat loop polls on.
apalis-core = { version = "0.7", features = ["json", "sleep"] }
# Timestamps for run_at/lock_at columns: chrono, matching sqlx's chrono
# support for TIMESTAMPTZ.
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
# The Postgres driver behind the storage: tokio runtime + rustls, matching
# the workspace's no-native-tls stance.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
] }

# OpenTelemetry API, SDK, and the OTLP exporter behind the metrics otel
# engine: gRPC (tonic) and HTTP (proto) transports both enabled.
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "http-proto"] }

# Directory watching for the config file engine: the parent-dir watch
# survives the atomic rename editors save through.
notify = "8"

# The encoding engines: object-safe serde marshaling over the
# `rushwind-encoding` Codec contract. erased-serde gives the contract its
# dyn-compatible surface; the rest are the per-format serializers. toml
# stays on the 0.8 line (1.1 needs rustc 1.85, above the workspace floor);
# serde_yaml is upstream-deprecated but still the most battle-tested YAML
# serde implementation, mirroring Go's own maintenance-mode yaml.v3.
erased-serde = "0.4"
rmp-serde = "1"
serde_yaml = "0.9"
toml = "0.8"
ciborium = "0.2"
bson = "2"
quick-xml = { version = "0.37", features = ["serialize"] }

# Workspace-wide lint policy: RushWind crates contain no unsafe code, period.
[workspace.lints.rust]
unsafe_code = "forbid"
