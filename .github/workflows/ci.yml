name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: gates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # etcd-client's build script compiles protobuf definitions and needs
      # a real protoc binary — none of the runner images ship one.
      - name: Install protoc (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install protoc (macos)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Install protoc (windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y --no-progress

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  storage-integration:
    name: storage conformance (live databases)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rushwind
          POSTGRES_PASSWORD: rushwind
          POSTGRES_DB: rushwind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rushwind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rushwind
          MYSQL_DATABASE: rushwind
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -prushwind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Transactions (batch-create atomicity) need a replica set; a
      # single-node one is the smallest deployment that provides them.
      # Started as a plain docker step — service-container entrypoint
      # overrides proved unreliable.
      - name: Start MongoDB (single-node replica set)
        run: |
          docker run -d --name mongodb -p 27017:27017 mongo:7 mongod --replSet rs0 --bind_ip_all
          sleep 8
          docker exec mongodb mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})"
          sleep 5

      - name: SeaORM suite against PostgreSQL
        run: cargo test -p rushwind-storage-seaorm --features live
        env:
          STORAGE_DATABASE_URL: postgres://rushwind:rushwind@localhost:5432/rushwind

      - name: SeaORM suite against MySQL
        run: cargo test -p rushwind-storage-seaorm --features live
        env:
          STORAGE_DATABASE_URL: mysql://root:rushwind@localhost:3306/rushwind

      - name: MongoDB suite
        run: cargo test -p rushwind-storage-mongodb --features live
        env:
          MONGODB_URI: mongodb://localhost:27017/?directConnection=true

      - name: Start Cassandra (single node)
        run: |
          docker run -d --name cassandra -p 9042:9042 -e CASSANDRA_BROADCAST_ADDRESS=127.0.0.1 cassandra:5.0
          sleep 75
          docker exec cassandra cqlsh -e "CREATE KEYSPACE IF NOT EXISTS rushwind_suite WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1}"

      - name: Cassandra suite
        run: cargo test -p rushwind-storage-cassandra --features live
        env:
          CASSANDRA_HOSTS: 127.0.0.1:9042

      - name: Start OpenSearch (single node, security off)
        run: |
          docker run -d --name opensearch -p 9201:9200 -e discovery.type=single-node -e DISABLE_SECURITY_PLUGIN=true opensearchproject/opensearch:2
          sleep 45

      - name: OpenSearch suite
        run: cargo test -p rushwind-storage-opensearch --features live
        env:
          OPENSEARCH_URL: http://localhost:9201

      - name: Start InfluxDB 1.8
        run: |
          docker run -d --name influxdb -p 8086:8086 -e INFLUXDB_DB=rushwind influxdb:1.8-alpine
          sleep 8

      - name: InfluxDB suite
        run: cargo test -p rushwind-storage-influxdb --features live
        env:
          INFLUXDB_URL: http://localhost:8086
          INFLUXDB_DB: rushwind

      - name: Start ClickHouse
        run: |
          docker run -d --name clickhouse -p 8123:8123             -e CLICKHOUSE_USER=rushwind -e CLICKHOUSE_PASSWORD=rushwind             -e CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1             clickhouse/clickhouse-server:24.8
          sleep 15

      - name: ClickHouse suite
        run: cargo test -p rushwind-storage-clickhouse --features live
        env:
          CLICKHOUSE_URL: http://rushwind:rushwind@localhost:8123

  registry-integration:
    name: registry conformance (live backends)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Same as gates: etcd-client's build script needs protoc.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Start etcd
        run: |
          docker run -d --name etcd -p 2379:2379 --entrypoint etcd quay.io/coreos/etcd:v3.5.16 \
            --listen-client-urls=http://0.0.0.0:2379 --advertise-client-urls=http://localhost:2379
          sleep 5
          curl -fsS http://localhost:2379/health

      - name: Start consul
        run: |
          docker run -d --name consul -p 8500:8500 hashicorp/consul:1.21 consul agent -dev -client=0.0.0.0
          sleep 5
          curl -fsS http://localhost:8500/v1/status/leader

      - name: Start zookeeper
        run: |
          docker run -d --name zookeeper -p 2181:2181 zookeeper:3.9
          sleep 10

      - name: Start nacos
        run: |
          docker run -d --name nacos -e MODE=standalone -e NACOS_AUTH_ENABLE=false -e JVM_XMS=256m -e JVM_XMX=256m -p 8848:8848 -p 9848:9848 nacos/nacos-server:v2.3.2
          for i in $(seq 1 60); do curl -fsS http://localhost:8848/nacos/ >/dev/null 2>&1 && break; sleep 5; done

      - name: Start service-center
        run: |
          docker run -d --name servicecenter -p 30100:30100 servicecomb/service-center:latest
          for i in $(seq 1 60); do curl -fsS http://localhost:30100/health >/dev/null 2>&1 && break; sleep 5; done

      - name: Start polaris
        run: |
          docker run -d --name polaris -p 8090:8090 polarismesh/polaris-standalone:latest
          for i in $(seq 1 60); do curl -fsS http://localhost:8090/ >/dev/null 2>&1 && break; sleep 5; done

      - name: Start eureka
        run: |
          docker run -d --name eureka -p 8761:8761 steeltoeoss/eureka-server:latest
          for i in $(seq 1 60); do curl -fsS http://localhost:8761/ >/dev/null 2>&1 && break; sleep 5; done

      - name: Etcd suite
        run: |
          cargo test -p rushwind-registry-etcd --features live -- --nocapture 2>&1 | tee /tmp/etcd-suite.log
          exit ${PIPESTATUS[0]}
        env:
          REGISTRY_ETCD_ENDPOINT: http://localhost:2379

      - name: Consul suite
        run: |
          cargo test -p rushwind-registry-consul --features live -- --nocapture 2>&1 | tee /tmp/consul-suite.log
          exit ${PIPESTATUS[0]}
        env:
          CONSUL_HTTP_ADDR: http://127.0.0.1:8500

      - name: Zookeeper suite
        run: |
          cargo test -p rushwind-registry-zookeeper --features live -- --nocapture 2>&1 | tee /tmp/zookeeper-suite.log
          exit ${PIPESTATUS[0]}
        env:
          REGISTRY_ZOOKEEPER_ADDRESS: 127.0.0.1:2181

      - name: Nacos suite
        run: |
          cargo test -p rushwind-registry-nacos --features live -- --nocapture 2>&1 | tee /tmp/nacos-suite.log
          exit ${PIPESTATUS[0]}
        env:
          REGISTRY_NACOS_ADDRESS: 127.0.0.1:8848

      - name: Eureka suite
        run: |
          cargo test -p rushwind-registry-eureka --features live -- --nocapture 2>&1 | tee /tmp/eureka-suite.log
          exit ${PIPESTATUS[0]}
        env:
          REGISTRY_EUREKA_ADDRESS: http://127.0.0.1:8761

      - name: Polaris suite
        run: |
          cargo test -p rushwind-registry-polaris --features live -- --nocapture 2>&1 | tee /tmp/polaris-suite.log
          exit ${PIPESTATUS[0]}
        env:
          REGISTRY_POLARIS_ADDRESS: http://127.0.0.1:8090

      - name: ServiceComb suite
        run: |
          cargo test -p rushwind-registry-servicecomb --features live -- --nocapture 2>&1 | tee /tmp/servicecomb-suite.log
          exit ${PIPESTATUS[0]}
        env:
          REGISTRY_SERVICECOMB_ADDRESS: http://127.0.0.1:30100

      - name: Report suite failure detail
        if: failure()
        run: |
          grep -h "panicked at\|register must\|etcd\|consul\|zookeeper\|nacos\|eureka\|servicecomb\|polaris" /tmp/etcd-suite.log /tmp/consul-suite.log /tmp/zookeeper-suite.log /tmp/nacos-suite.log /tmp/eureka-suite.log /tmp/servicecomb-suite.log /tmp/polaris-suite.log 2>/dev/null \
            | grep -v "^     Running\|Compiling\|warning" | head -20 | cut -c1-900 | sed 's/^/::error::/'

  broker-integration:
    name: broker conformance (live mqtt)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Start emqx
        run: |
          docker run -d --name emqx -p 1883:1883 emqx:latest
          for i in $(seq 1 60); do curl -fsS http://localhost:18083/ >/dev/null 2>&1 && break; sleep 2; done

      - name: Mqtt suite
        run: |
          cargo test -p rushwind-broker-mqtt --features live -- --nocapture 2>&1 | tee /tmp/mqtt-suite.log
          exit ${PIPESTATUS[0]}
        env:
          BROKER_MQTT_ADDRESS: 127.0.0.1:1883

      - name: Report suite failure detail
        if: failure()
        run: grep -h "panicked at\|must succeed\|mqtt" /tmp/mqtt-suite.log | grep -v "^     Running\|Compiling\|warning" | head -20 | cut -c1-900 | sed 's/^/::error::/'
