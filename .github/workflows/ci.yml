name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: gates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  storage-integration:
    name: storage conformance (live databases)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rushwind
          POSTGRES_PASSWORD: rushwind
          POSTGRES_DB: rushwind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rushwind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rushwind
          MYSQL_DATABASE: rushwind
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -prushwind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        # Transactions (batch-create atomicity) need a replica set; a
        # single-node one is the smallest deployment that provides them.
        options: >-
          --entrypoint mongod
          --replSet rs0
          --bind_ip_all

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: SeaORM suite against PostgreSQL
        run: cargo test -p rushwind-storage-seaorm --features live
        env:
          STORAGE_DATABASE_URL: postgres://rushwind:rushwind@localhost:5432/rushwind

      - name: SeaORM suite against MySQL
        run: cargo test -p rushwind-storage-seaorm --features live
        env:
          STORAGE_DATABASE_URL: mysql://root:rushwind@localhost:3306/rushwind

      - name: Initiate MongoDB replica set
        run: |
          docker exec $(docker ps --filter name=mongodb --format '{{.ID}}') mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})"
          sleep 5

      - name: MongoDB suite
        run: cargo test -p rushwind-storage-mongodb --features live
        env:
          MONGODB_URI: mongodb://localhost:27017/?directConnection=true

  registry-integration:
    name: registry conformance (live etcd)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      etcd:
        image: quay.io/coreos/etcd:v3.5.16
        env:
          ETCD_ADVERTISE_CLIENT_URLS: http://0.0.0.0:2379
          ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
        ports:
          - 2379:2379

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Etcd suite
        run: cargo test -p rushwind-registry-etcd --features live
        env:
          REGISTRY_ETCD_ENDPOINT: http://localhost:2379
