name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: gates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # etcd-client's build script compiles protobuf definitions and needs
      # a real protoc binary — none of the runner images ship one.
      - name: Install protoc (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install protoc (macos)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Install protoc (windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y --no-progress

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  storage-integration:
    name: storage conformance (live databases)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rushwind
          POSTGRES_PASSWORD: rushwind
          POSTGRES_DB: rushwind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rushwind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rushwind
          MYSQL_DATABASE: rushwind
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -prushwind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Transactions (batch-create atomicity) need a replica set; a
      # single-node one is the smallest deployment that provides them.
      # Started as a plain docker step — service-container entrypoint
      # overrides proved unreliable.
      - name: Start MongoDB (single-node replica set)
        run: |
          docker run -d --name mongodb -p 27017:27017 mongo:7 mongod --replSet rs0 --bind_ip_all
          sleep 8
          docker exec mongodb mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})"
          sleep 5

      - name: SeaORM suite against PostgreSQL
        run: cargo test -p rushwind-storage-seaorm --features live
        env:
          STORAGE_DATABASE_URL: postgres://rushwind:rushwind@localhost:5432/rushwind

      - name: SeaORM suite against MySQL
        run: cargo test -p rushwind-storage-seaorm --features live
        env:
          STORAGE_DATABASE_URL: mysql://root:rushwind@localhost:3306/rushwind

      - name: MongoDB suite
        run: cargo test -p rushwind-storage-mongodb --features live
        env:
          MONGODB_URI: mongodb://localhost:27017/?directConnection=true

      - name: Start Cassandra (single node)
        run: |
          docker run -d --name cassandra -p 9042:9042 -e CASSANDRA_BROADCAST_ADDRESS=127.0.0.1 cassandra:5.0
          sleep 75
          docker exec cassandra cqlsh -e "CREATE KEYSPACE IF NOT EXISTS rushwind_suite WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1}"

      - name: Cassandra suite
        run: cargo test -p rushwind-storage-cassandra --features live
        env:
          CASSANDRA_HOSTS: 127.0.0.1:9042

      - name: Start OpenSearch (single node, security off)
        run: |
          docker run -d --name opensearch -p 9201:9200 -e discovery.type=single-node -e DISABLE_SECURITY_PLUGIN=true opensearchproject/opensearch:2
          sleep 45

      - name: OpenSearch suite
        run: cargo test -p rushwind-storage-opensearch --features live
        env:
          OPENSEARCH_URL: http://localhost:9201

      - name: Start InfluxDB 1.8
        run: |
          docker run -d --name influxdb -p 8086:8086 -e INFLUXDB_DB=rushwind influxdb:1.8-alpine
          sleep 8

      - name: InfluxDB suite
        run: cargo test -p rushwind-storage-influxdb --features live
        env:
          INFLUXDB_URL: http://localhost:8086
          INFLUXDB_DB: rushwind

      - name: Start ClickHouse
        run: |
          docker run -d --name clickhouse -p 8123:8123             -e CLICKHOUSE_USER=rushwind -e CLICKHOUSE_PASSWORD=rushwind             -e CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1             clickhouse/clickhouse-server:24.8
          sleep 15

      - name: ClickHouse suite
        run: cargo test -p rushwind-storage-clickhouse --features live
        env:
          CLICKHOUSE_URL: http://rushwind:rushwind@localhost:8123

  registry-integration:
    name: registry conformance (live backends)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Same as gates: etcd-client's build script needs protoc.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Start etcd
        run: |
          docker run -d --name etcd -p 2379:2379 --entrypoint etcd quay.io/coreos/etcd:v3.5.16 \
            --listen-client-urls=http://0.0.0.0:2379 --advertise-client-urls=http://localhost:2379
          sleep 5
          curl -fsS http://localhost:2379/health

      - name: Start consul
        run: |
          docker run -d --name consul -p 8500:8500 hashicorp/consul:1.21 consul agent -dev -client=0.0.0.0
          sleep 5
          curl -fsS http://localhost:8500/v1/status/leader

      - name: Start zookeeper
        run: |
          docker run -d --name zookeeper -p 2181:2181 zookeeper:3.9
          sleep 10

      - name: Start nacos
        run: |
          docker run -d --name nacos -e MODE=standalone -e NACOS_AUTH_ENABLE=false -e JVM_XMS=256m -e JVM_XMX=256m -p 8848:8848 -p 9848:9848 nacos/nacos-server:v2.3.2
          for i in $(seq 1 60); do curl -fsS http://localhost:8848/nacos/ >/dev/null 2>&1 && break; sleep 5; done

      - name: Start service-center
        run: |
          docker run -d --name servicecenter -p 30100:30100 servicecomb/service-center:latest
          for i in $(seq 1 60); do curl -fsS http://localhost:30100/health >/dev/null 2>&1 && break; sleep 5; done

      - name: Start polaris
        run: |
          docker run -d --name polaris -p 8090:8090 polarismesh/polaris-standalone:latest
          for i in $(seq 1 60); do curl -fsS http://localhost:8090/ >/dev/null 2>&1 && break; sleep 5; done

      - name: Start eureka
        run: |
          docker run -d --name eureka -p 8761:8761 steeltoeoss/eureka-server:latest
          for i in $(seq 1 60); do curl -fsS http://localhost:8761/ >/dev/null 2>&1 && break; sleep 5; done

      - name: Etcd suite
        run: |
          cargo test -p rushwind-registry-etcd --features live -- --nocapture 2>&1 | tee /tmp/etcd-suite.log
          exit ${PIPESTATUS[0]}
        env:
          REGISTRY_ETCD_ENDPOINT: http://localhost:2379

      - name: Consul suite
        run: |
          cargo test -p rushwind-registry-consul --features live -- --nocapture 2>&1 | tee /tmp/consul-suite.log
          exit ${PIPESTATUS[0]}
        env:
          CONSUL_HTTP_ADDR: http://127.0.0.1:8500

      - name: Zookeeper suite
        run: |
          cargo test -p rushwind-registry-zookeeper --features live -- --nocapture 2>&1 | tee /tmp/zookeeper-suite.log
          exit ${PIPESTATUS[0]}
        env:
          REGISTRY_ZOOKEEPER_ADDRESS: 127.0.0.1:2181

      - name: Nacos suite
        run: |
          cargo test -p rushwind-registry-nacos --features live -- --nocapture 2>&1 | tee /tmp/nacos-suite.log
          exit ${PIPESTATUS[0]}
        env:
          REGISTRY_NACOS_ADDRESS: 127.0.0.1:8848

      - name: Eureka suite
        run: |
          cargo test -p rushwind-registry-eureka --features live -- --nocapture 2>&1 | tee /tmp/eureka-suite.log
          exit ${PIPESTATUS[0]}
        env:
          REGISTRY_EUREKA_ADDRESS: http://127.0.0.1:8761

      - name: Polaris suite
        run: |
          cargo test -p rushwind-registry-polaris --features live -- --nocapture 2>&1 | tee /tmp/polaris-suite.log
          exit ${PIPESTATUS[0]}
        env:
          REGISTRY_POLARIS_ADDRESS: http://127.0.0.1:8090

      - name: ServiceComb suite
        run: |
          cargo test -p rushwind-registry-servicecomb --features live -- --nocapture 2>&1 | tee /tmp/servicecomb-suite.log
          exit ${PIPESTATUS[0]}
        env:
          REGISTRY_SERVICECOMB_ADDRESS: http://127.0.0.1:30100

      - name: Report suite failure detail
        if: failure()
        run: |
          grep -h "panicked at\|register must\|etcd\|consul\|zookeeper\|nacos\|eureka\|servicecomb\|polaris" /tmp/etcd-suite.log /tmp/consul-suite.log /tmp/zookeeper-suite.log /tmp/nacos-suite.log /tmp/eureka-suite.log /tmp/servicecomb-suite.log /tmp/polaris-suite.log 2>/dev/null \
            | grep -v "^     Running\|Compiling\|warning" | head -20 | cut -c1-900 | sed 's/^/::error::/'

  broker-integration:
    name: broker conformance (live mqtt)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Start emqx
        run: |
          docker run -d --name emqx -p 1883:1883 emqx:latest
          for i in $(seq 1 60); do curl -fsS http://localhost:18083/ >/dev/null 2>&1 && break; sleep 2; done

      - name: Start redis
        run: |
          docker run -d --name broker-redis -p 6379:6379 redis:latest
          for i in $(seq 1 30); do docker exec broker-redis redis-cli ping 2>/dev/null | grep -q PONG && break; sleep 2; done

      - name: Start nats
        run: |
          docker run -d --name broker-nats -p 4222:4222 nats:latest
          sleep 5

      - name: Start rabbitmq
        run: |
          docker run -d --name broker-rabbitmq -p 5672:5672 -p 61613:61613 rabbitmq:latest
          docker exec broker-rabbitmq rabbitmq-plugins enable rabbitmq_stomp
          sleep 10

      # Apache Kafka in KRaft single-node mode: the engine's live
      # suite creates its probe topics explicitly, so auto-create
      # stays off.
      - name: Start kafka
        run: |
          docker run -d --name broker-kafka -p 9092:9092 \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:9092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@127.0.0.1:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_AUTO_CREATE_TOPICS_ENABLE=false \
            apache/kafka:latest
          for i in $(seq 1 60); do docker exec broker-kafka /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1 && break; sleep 2; done

      # Apache Pulsar standalone: the binary protocol listener on
      # 6650 is the only surface the engine touches; the admin port
      # stays unmapped.
      - name: Start pulsar
        run: |
          docker run -d --name broker-pulsar -p 6650:6650 apachepulsar/pulsar-standalone:latest
          for i in $(seq 1 90); do timeout 2 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6650' 2>/dev/null && break; sleep 2; done

      - name: Mqtt suite
        run: |
          cargo test -p rushwind-broker-mqtt --features live -- --nocapture 2>&1 | tee /tmp/mqtt-suite.log
          exit ${PIPESTATUS[0]}
        env:
          BROKER_MQTT_ADDRESS: 127.0.0.1:1883

      - name: Redis suite
        run: |
          cargo test -p rushwind-broker-redis --features live -- --nocapture 2>&1 | tee /tmp/redis-suite.log
          exit ${PIPESTATUS[0]}
        env:
          BROKER_REDIS_URL: redis://127.0.0.1:6379

      - name: Nats suite
        run: |
          cargo test -p rushwind-broker-nats --features live -- --nocapture 2>&1 | tee /tmp/nats-suite.log
          exit ${PIPESTATUS[0]}
        env:
          BROKER_NATS_ADDRESS: nats://127.0.0.1:4222

      - name: Rabbitmq suite
        run: |
          cargo test -p rushwind-broker-rabbitmq --features live -- --nocapture 2>&1 | tee /tmp/rabbitmq-suite.log
          exit ${PIPESTATUS[0]}
        env:
          BROKER_RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672

      - name: Stomp suite
        run: |
          cargo test -p rushwind-broker-stomp --features live -- --nocapture 2>&1 | tee /tmp/stomp-suite.log
          exit ${PIPESTATUS[0]}
        env:
          BROKER_STOMP_ADDRESS: 127.0.0.1:61613

      - name: Kafka suite
        run: |
          cargo test -p rushwind-broker-kafka --features live -- --nocapture 2>&1 | tee /tmp/kafka-suite.log
          exit ${PIPESTATUS[0]}
        env:
          BROKER_KAFKA_ADDRS: 127.0.0.1:9092

      - name: Pulsar suite
        run: |
          cargo test -p rushwind-broker-pulsar --features live -- --nocapture 2>&1 | tee /tmp/pulsar-suite.log
          exit ${PIPESTATUS[0]}
        env:
          BROKER_PULSAR_ADDRESS: pulsar://127.0.0.1:6650

      - name: Report suite failure detail
        if: failure()
        run: grep -h "panicked at\|must succeed\|mqtt\|redis\|nats\|rabbitmq\|stomp\|kafka\|pulsar" /tmp/mqtt-suite.log /tmp/redis-suite.log /tmp/nats-suite.log /tmp/rabbitmq-suite.log /tmp/stomp-suite.log /tmp/kafka-suite.log /tmp/pulsar-suite.log | grep -v "^     Running\|Compiling\|warning" | head -20 | cut -c1-900 | sed 's/^/::error::/'

  oss-integration:
    name: oss conformance (live minio)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Start minio
        run: |
          docker run -d --name minio -p 9100:9000 -e MINIO_ROOT_USER=rushwind -e MINIO_ROOT_PASSWORD=rushwind-secret minio/minio:latest server /data
          for i in $(seq 1 60); do curl -fsS http://localhost:9100/minio/health/live >/dev/null 2>&1 && break; sleep 2; done

      - name: S3 suite
        run: |
          cargo test -p rushwind-oss-s3 --features live -- --nocapture 2>&1 | tee /tmp/s3-suite.log
          exit ${PIPESTATUS[0]}
        env:
          OSS_S3_ENDPOINT: 127.0.0.1:9100
          OSS_S3_ACCESS_KEY: rushwind
          OSS_S3_SECRET_KEY: rushwind-secret
          OSS_S3_BUCKET: rushwind-test

      - name: Report suite failure detail
        if: failure()
        run: grep -h "panicked at\|must succeed\|s3" /tmp/s3-suite.log | grep -v "^     Running\|Compiling\|warning" | head -20 | cut -c1-900 | sed 's/^/::error::/'

  transaction-dtm-integration:
    name: transaction conformance (live dtm)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Start dtm
        run: |
          docker run -d --name dtm -p 36789:36789 yedf/dtm:latest
          for i in $(seq 1 60); do curl -fsS "http://localhost:36789/api/dtmsvr/query" >/dev/null 2>&1 && break; sleep 2; done

      - name: DTM suite
        run: |
          cargo test -p rushwind-transaction-dtm --features live -- --nocapture 2>&1 | tee /tmp/dtm-suite.log
          exit ${PIPESTATUS[0]}
        env:
          DTM_SERVER: http://127.0.0.1:36789/api/dtmsvr

      - name: Report suite failure detail
        if: failure()
        run: grep -h "panicked at\|must succeed\|dtm never called" /tmp/dtm-suite.log | grep -v "^     Running\|Compiling\|warning" | head -20 | cut -c1-900 | sed 's/^/::error::/'

  apalis-pg-integration:
    name: task queue conformance (live postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rushwind
          POSTGRES_PASSWORD: rushwind
          POSTGRES_DB: rushwind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rushwind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Apalis postgres suite
        run: |
          cargo test -p rushwind-apalis-postgres --features live -- --nocapture --test-threads=1 2>&1 | tee /tmp/apalis-pg-suite.log
          exit ${PIPESTATUS[0]}
        env:
          APALIS_PG_DATABASE_URL: postgres://rushwind:rushwind@localhost:5432/rushwind

      - name: Report suite failure detail
        if: failure()
        run: grep -h "panicked at\|apalis postgres storage failed" /tmp/apalis-pg-suite.log | grep -v "^     Running\|Compiling\|warning" | head -20 | cut -c1-900 | sed 's/^/::error::/'
